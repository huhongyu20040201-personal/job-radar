# ============================================================
# job-radar config
# The company list lives in companies.yaml (~2,400 boards, auto-generated).
# This file only decides *which* jobs you want. Edit, then run: python jobradar.py
# ============================================================

# Company list file. To add a few companies ad hoc, you can also put a
# `sources:` block in this file — it gets merged with the list below.
sources_file: companies.yaml

fetch:
  # Concurrency. 12 finishes ~2,400 boards in 3-4 minutes; higher mostly earns HTTP 429s.
  workers: 12
  # Workday hard-caps a page at 20 postings but sorts newest-first, so the first
  # few pages are the newest few dozen.
  # Note: don't use searchText for server-side filtering — adding it switches the
  # sort to relevance, and page 1 fills up with 30-day-old postings, which makes
  # "what's new today" unanswerable.
  # 2 pages = newest 40 per site. Boards like Nvidia post 20+ a day, so 1 page misses some.
  workday_pages: 2

filters:
  # ---------- 1. Keep engineering roles ----------
  # A title must match at least one entry. Entries starting with "re:" are regexes.
  include_any:
    - software engineer
    - software developer
    - backend
    - back-end
    - frontend
    - front-end
    - full stack
    - fullstack
    - infrastructure engineer
    - platform engineer
    - systems engineer
    - data engineer
    - machine learning engineer
    - "re:\\bML engineer\\b"
    - "re:\\bSDE\\b"
    - "re:\\bSWE\\b"
    - new grad
    - new graduate
    - university graduate
    - college graduate
    - early career
    - entry level
    - entry-level
    - associate engineer

  # ---------- 2. Drop anything that isn't new-grad level ----------
  # This is where most of the noise reduction happens. Any match drops the job.
  exclude_any:
    # Seniority
    - "re:\\bsenior\\b"
    - "re:\\bsr\\.?\\b"
    - "re:\\bstaff\\b"
    - "re:\\bprincipal\\b"
    - distinguished
    - "re:\\bfellow\\b"
    - "re:\\blead\\b"
    - "re:\\bII\\b"
    - "re:\\bIII\\b"
    - "re:\\bIV\\b"
    - "re:\\b\\d+\\+?\\s*years?\\b"
    # Levels: L1-L3 / E1-E3 are new-grad; L4 and up are not
    - "re:\\bL[4-9]\\b"
    - "re:\\bE[4-9]\\b"
    # Management
    - manager
    - director
    - "re:\\bhead of\\b"
    - "re:\\bVP\\b"
    - president
    - "re:\\bchief\\b"
    - architect
    # Not a full-time entry-level role
    - "re:\\bintern\\b"
    - internship
    - "re:\\bco-?op\\b"
    - unpaid
    - volunteer
    - "re:\\bPhD\\b"
    - contractor
    # Not engineering (these leak in from a list this large)
    - sales
    - recruiter
    - designer
    - marketing
    - accountant
    - attorney
    - nurse
    - teacher
    - technician
    - mechanic
    - driver

  # ---------- 3. Star explicit new-grad roles and sort them first ----------
  boost_any:
    - new grad
    - new graduate
    - university graduate
    - college graduate
    - campus
    - early career
    - entry level
    - entry-level
    - "re:\\bengineer,? I\\b"
    - "re:\\bL3\\b"
    - "re:\\bE3\\b"
    - associate
    - rotational
    - "re:\\b202[67]\\b"

  # ---------- 4. Location: the whole SF Bay Area, plus remote ----------
  locations_any:
    - bay area
    - san francisco
    - "re:\\bSF\\b"
    - palo alto
    - mountain view
    - sunnyvale
    - san jose
    - santa clara
    - menlo park
    - redwood city
    - cupertino
    - oakland
    - berkeley
    - foster city
    - san mateo
    - fremont
    - milpitas
    - emeryville
    - burlingame
    - san carlos
    - los altos
    - campbell
    - pleasanton
    - alameda
    - san bruno
    - hayward
    - remote

  # Location blocklist; runs before the allowlist.
  # Needed because "remote" is on the allowlist — without this, "Remote Spain" gets in.
  locations_exclude_any:
    - spain
    - poland
    - portugal
    - romania
    - ukraine
    - ireland
    - united kingdom
    - "re:\\bUK\\b"
    - london
    - germany
    - berlin
    - france
    - paris
    - netherlands
    - amsterdam
    - india
    - bangalore
    - hyderabad
    - pune
    - canada
    - toronto
    - vancouver
    - mexico
    - brazil
    - argentina
    - colombia
    - australia
    - sydney
    - singapore
    - japan
    - tokyo
    - china
    - shanghai
    - beijing
    - korea
    - taiwan
    - israel
    - "re:\\bEMEA\\b"
    - "re:\\bAPAC\\b"
    - "re:\\bLATAM\\b"
    - philippines
    - vietnam
    - indonesia

  # ---------- Years of experience ----------
  # Minimum years required, as read from the job description. Anything above this is dropped.
  # 1 means "0-1 years is fine, 2+ years is out".
  # Jobs with no description, or whose description never mentions years, are kept
  # (see the comment in apply_filters).
  # Descriptions are available for greenhouse / lever / ashby; not for smartrecruiters / workday.
  max_years_experience: 1

  max_age_days: 14

  # Jobs with an empty location field: keep / drop.
  # Empty locations are common across thousands of boards and "keep" gets noisy, so drop.
  unknown_location: drop

output:
  markdown: digest.md
  telegram:
    # The bot token and chat_id come from environment variables, never from this file.
    # On GitHub, set them under Settings -> Secrets and variables -> Actions.
    enabled: true
  max_items: 60

state:
  path: seen.json
  forget_after_days: 120
