name: job-radar

on:
  schedule:
    # cron is UTC-only and knows nothing about daylight saving. PDT = UTC-7.
    #
    # Observed start delays (both with an on-the-hour "0 18" schedule):
    #   08-05 scheduled 18:00 -> started 22:17, 4h17m late
    #   08-06 scheduled 18:00 -> started 01:53 next day, 7h53m late
    # GitHub schedules are best-effort, and the top of the hour is the most congested.
    #
    # Mitigation 1: avoid :00 and pick an off-peak minute.
    # Mitigation 2: run twice a day, so at least one run has finished before noon.
    #   If the early run is delayed, the later one covers for it; dedup guarantees
    #   the same job is never pushed twice.
    - cron: "6 16 * * *"      # 09:06 PDT — primary
    - cron: "36 18 * * *"     # 11:36 PDT — backup, also catches jobs posted that morning
  workflow_dispatch:        # can also be triggered manually from the Actions tab

permissions:
  contents: write           # needed to push seen.json to the state branch

# Never let two runs overlap: both would push to the state branch and one would lose.
concurrency:
  group: job-radar
  cancel-in-progress: false

env:
  STATE_BRANCH: state

jobs:
  scan:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes. Kill a stuck one early instead of burning the default 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # Run state lives on its own branch so main only holds code: forks start
      # clean, and main's history isn't buried under daily bot commits.
      # No state branch yet (e.g. a fresh fork) just means starting from scratch.
      - name: Load state
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH"; then
            git show FETCH_HEAD:seen.json > seen.json && echo "Loaded seen.json"
          else
            echo "No $STATE_BRANCH branch yet; starting with empty state"
          fi

      - name: Scan job boards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobradar.py

      # seen.json must be saved; otherwise every run starts from scratch and
      # re-sends the same jobs every day.
      - name: Save state
        run: |
          git config user.name  "job-radar"
          git config user.email "actions@github.com"
          mkdir -p "$RUNNER_TEMP/state"
          mv seen.json digest.md "$RUNNER_TEMP/state/"
          if git fetch origin "$STATE_BRANCH"; then
            git switch --detach FETCH_HEAD
          else
            git switch --orphan "$STATE_BRANCH"
          fi
          cp "$RUNNER_TEMP/state/seen.json" "$RUNNER_TEMP/state/digest.md" .
          git add -f seen.json digest.md
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "scan $(date -u +%F)"
          git push origin "HEAD:refs/heads/$STATE_BRANCH"

      # The digest also shows up in the run's Summary page
      - name: Show digest
        if: always()
        run: |
          for f in digest.md "$RUNNER_TEMP/state/digest.md"; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" && break
          done
          true

      # Speak up on failure. Otherwise a failed run is silent — you'd just think
      # "no new jobs today" and couldn't tell that from "it never ran".
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ job-radar run failed today. Logs: $RUN_URL" \
            -o /dev/null
